<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업로드 — Retone</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/upload.css">
</head>
<body>
<!-- 상태 미리보기: upload.html?demo=empty|originalOnly|referenceOnly|both|uploading|failed|badType|tooBig  /  실패 시뮬레이션: ?failUpload=1 -->
<div class="u-page">
  <aside class="u-aside">
    <a class="logo" href="index.html"><span class="logo-mark"></span><span class="logo-word">Retone</span></a>
    <div class="u-intro">
      <h1 class="display"><span>(</span>Upload.<span>)</span></h1>
      <div class="lead"><p>Taking photo<br>what you often see</p></div>
    </div>
    <div class="checklist">
      <div class="check" id="check-original" data-status="empty"><i class="check-dot"></i><div><b>Original</b><span>아직 올리지 않았어요</span></div></div>
      <div class="check" id="check-reference" data-status="empty"><i class="check-dot"></i><div><b>Reference</b><span>아직 올리지 않았어요</span></div></div>
    </div>
    <div class="start">
      <button class="btn btn-primary btn-xl" id="startBtn" disabled>분석 시작<span class="arrow">→</span></button>
      <small id="startHelp"></small>
    </div>
    <div class="u-foot"><span>JPG · PNG · HEIC · RAW</span><span>파일당 최대 50MB</span></div>
  </aside>

  <main class="u-main">
    <section class="u-section">
      <div class="u-section-head">
        <div><b>Original</b><span>보정할 내 사진</span></div>
        <em class="u-state" id="state-original" data-status="empty" style="font-style:normal">비어 있음</em>
      </div>
      <div class="slot" id="slot-original" data-slot="original" data-status="empty"></div>
    </section>
    <section class="u-section">
      <div class="u-section-head">
        <div><b>Reference</b><span>닮고 싶은 색감의 사진</span></div>
        <em class="u-state" id="state-reference" data-status="empty" style="font-style:normal">비어 있음</em>
      </div>
      <div class="slot" id="slot-reference" data-slot="reference" data-status="empty"></div>
    </section>
    <input type="file" id="file-original" class="visually-hidden" accept=".jpg,.jpeg,.png,.heic,.heif,.raw,.dng,.cr2,.cr3,.nef,.arw,.orf,.rw2,.raf,image/*">
    <input type="file" id="file-reference" class="visually-hidden" accept=".jpg,.jpeg,.png,.heic,.heif,.raw,.dng,.cr2,.cr3,.nef,.arw,.orf,.rw2,.raf,image/*">
  </main>

</div>

<script src="js/core.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
