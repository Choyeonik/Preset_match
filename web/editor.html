<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편집 — Retone</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="e-page">
  <header class="e-top">
    <a href="index.html" aria-label="홈"><span class="logo-mark"></span></a>
    <div class="vr"></div>
    <div class="e-file">
      <div class="e-thumb" id="origThumb"></div>
      <div style="min-width:0">
        <div class="e-file-name" id="origName">IMG_2041.JPG</div>
        <div class="e-file-ref"><i id="refThumb"></i><span>Reference · <span id="refName">reference_film.jpg</span></span></div>
      </div>
      <div class="save-chip" id="saveChip" data-s="saved">저장됨</div>
    </div>
    <div class="e-actions">
      <div style="position:relative">
        <button class="btn btn-primary" id="saveBtn" style="padding:0 22px">저장</button>
        <div id="saveMenu" hidden>
          <div class="pop-scrim" data-close-pop></div>
          <div class="popover save-menu">
            <h3>무엇을 저장할까요?</h3>
            <div class="save-row">
              <div><b>사진</b><span>지금 보이는 보정 결과 그대로</span></div>
              <button class="fmt-btn" data-dl="image/jpeg">JPG</button>
              <button class="fmt-btn" data-dl="image/png">PNG</button>
            </div>
            <div class="hr"></div>
            <button class="save-row" id="xmpBtn">
              <div><b>XMP Preset</b><span>Lightroom에서 같은 보정값을 쓸 수 있어요</span></div>
              <em>.xmp</em>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="e-body">
    <div class="e-work">
      <div class="stage" id="stage">
        <div class="photo" id="photo">
          <div class="photo-clip"><canvas id="canvas"></canvas></div>
          <div class="photo-hit" id="photoHit"></div>
          <div id="splitUi" hidden>
            <div class="split-line" id="splitLine"><div class="split-knob">‹›</div></div>
            <span class="tag tag-before">Before</span>
            <span class="tag tag-dark tag-after">After</span>
          </div>
          <button class="expand" id="expandBtn" aria-label="크게 보기" title="크게 보기"></button>
          <span class="tag tag-md photo-chip" id="chip">자동 보정 결과</span>
          <div id="cropUi" hidden>
            <div id="cropBox">
              <i class="crop-h" data-h="tl"></i><i class="crop-h" data-h="tr"></i><i class="crop-h" data-h="bl"></i><i class="crop-h" data-h="br"></i>
            </div>
          </div>
        </div>
        <span class="hold-hint" id="holdHint">사진을 누르고 있으면 원본이 보여요</span>
        <div class="toast" id="toast" hidden><span class="toast-dot" id="toastDot">✓</span><span id="toastText"></span><button id="toastAction" hidden></button></div>
      </div>

      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button data-view="after" aria-pressed="true">보정 결과</button>
          <button data-view="split" aria-pressed="false">Before / After</button>
        </div>
        <div class="strength">
          <b>자동 보정 강도</b>
          <div class="strength-track" id="strength" tabindex="0" role="slider" aria-label="자동 보정 강도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="rail-bg"></div><div class="fill"></div><div class="knob"></div>
          </div>
          <output id="strengthVal">100%</output>
        </div>
        <div class="tool-right">
          <button class="btn btn-quiet" id="rotateBtn" title="90° 회전">⟳ 회전</button>
          <button class="btn btn-quiet" id="cropBtn" title="크롭">⤢ 크롭</button>
          <button class="btn btn-quiet" id="cropCancel" hidden>취소</button>
          <button class="btn btn-primary" id="cropApply" hidden>크롭 적용</button>
          <button class="btn btn-quiet" id="resetBtn" disabled>↺ 되돌리기</button>
          <div id="resetPop" hidden>
            <div class="pop-scrim" data-close-pop></div>
            <div class="popover reset-pop">
              <b>자동 보정 결과로 되돌릴까요?</b>
              <p>직접 조정한 값 <span id="modCount">0</span>개와 강도가 분석 직후 상태로 돌아가요.</p>
              <div class="row">
                <button class="btn btn-quiet" data-close-pop>취소</button>
                <button class="btn btn-primary btn-sm" id="doReset">되돌리기</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <b>세부 조정</b>
        <p>트랙의 회색 눈금이 자동 보정값이에요. 슬라이더를 더블클릭하면 그 값으로 돌아가요.</p>
      </div>
      <div id="sections"></div>
    </aside>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-bg" data-close-lb></div>
  <div class="lb-frame" id="lbFrame">
    <div class="lb-img" id="lbAfter" role="img" aria-label="보정 후 크게 보기"></div>
    <div class="lb-img" id="lbBefore"></div>
    <div class="lb-hit" id="lbHit"></div>
    <div class="split-line" id="lbLine"><div class="split-knob">‹›</div></div>
    <span class="tag tag-md tag-before">보정 전</span>
    <span class="tag tag-md tag-dark tag-after">보정 후</span>
  </div>
  <div class="lb-title"><b id="lbName"></b><span id="lbSub">보정 전 / 보정 후</span></div>
  <button class="icon-btn close-x lb-close" data-close-lb aria-label="닫기"></button>
</div>

<script src="js/core.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
